name: Test, Build & Deploy (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.6.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            --output godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"

      - name: Run headless suites
        shell: bash
        run: |
          set -euo pipefail
          godot_bin="$PWD/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          for suite in tests/*_test.gd; do
            echo "===== $suite ====="
            output="$(timeout 60s "$godot_bin" --headless --path . -s "$suite" 2>&1)"
            echo "$output"
            if grep -Eq 'SCRIPT ERROR|^ERROR:' <<<"$output"; then
              echo "Godot reported an engine or script error in $suite" >&2
              exit 1
            fi
          done

      - name: Smoke-test main scene
        shell: bash
        run: |
          set -euo pipefail
          godot_bin="$PWD/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          output="$(timeout 30s "$godot_bin" --headless --path . --quit-after 120 2>&1)"
          echo "$output"
          if grep -Eq 'SCRIPT ERROR|^ERROR:' <<<"$output"; then
            echo "Godot reported an engine or script error while starting the game" >&2
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Godot headless export (Web)
        id: godot
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: false

      - name: Publish gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ steps.godot.outputs.build_directory }}
          publish_branch: gh-pages
          force_orphan: true
