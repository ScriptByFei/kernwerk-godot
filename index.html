		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #0e111b;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

<script>
/*
 * iOS-Ton: Safari startet mit der Audio-Kategorie "ambient". Die wird vom
 * Stummschalter (Kippschalter) des Geraets stummgeschaltet — das Spiel ist dann
 * komplett tonlos, obwohl technisch alles laeuft. Genau das war der Befund vom
 * 14.09.2026: im Desktop-Browser ist am Ausgang messbar Ton, auf dem iPhone
 * hoert man nichts.
 *
 * "playback" schaltet die Seite in die Medien-Kategorie; sie ignoriert damit
 * den Stummschalter, so wie es ein Video oder Musikplayer tut. Verfuegbar ab
 * iOS 16.4 ueber navigator.audioSession.
 *
 * Der Umweg ueber ein stilles <audio>-Element fuer aeltere Geraete laeuft NUR
 * dort: er hat einen Nebeneffekt (AirPlay-Ziel und eine Abspielanzeige in der
 * Mitteilungszentrale), den wir nicht wollen, wenn es nicht noetig ist.
 *
 * Die ganze Datei steigt auf allen anderen Plattformen sofort aus. Android und
 * Desktop verhalten sich unveraendert.
 */
(function () {
  'use strict';

  function isIOS() {
    var agent = navigator.userAgent || '';
    if (/iPad|iPhone|iPod/.test(agent)) {
      return true;
    }
    // iPadOS meldet sich seit Version 13 als Mac. Ein Mac mit Touchpunkten ist
    // in Wirklichkeit ein iPad.
    return /Macintosh/.test(agent) && navigator.maxTouchPoints > 1;
  }

  if (!isIOS()) {
    return;
  }

  function usePlaybackCategory() {
    if (!navigator.audioSession) {
      return false;
    }
    try {
      navigator.audioSession.type = 'playback';
      return true;
    } catch (error) {
      return false;
    }
  }

  usePlaybackCategory();

  var silentElement = null;

  function armSilentElement() {
    if (silentElement) {
      return;
    }
    try {
      silentElement = document.createElement('audio');
      silentElement.setAttribute('playsinline', '');
      silentElement.setAttribute('loop', '');
      silentElement.preload = 'auto';
      silentElement.volume = 0.001;
      // Gueltiges WAV mit einem Sample Stille.
      silentElement.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAgD4AAAB9AAACABAAZGF0YQAAAAA=';
      document.body.appendChild(silentElement);
      var started = silentElement.play();
      if (started && typeof started.catch === 'function') {
        started.catch(function () {
          silentElement = null;
        });
      }
    } catch (error) {
      silentElement = null;
    }
  }

  function onFirstContact() {
    // Erneut versuchen: manche iOS-Versionen lassen die Kategorie erst nach
    // einer Beruehrung setzen.
    if (!usePlaybackCategory()) {
      armSilentElement();
    }
  }

  ['pointerdown', 'touchstart', 'click'].forEach(function (name) {
    window.addEventListener(name, onFirstContact, { passive: true });
  });
})();
</script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":3806104,"index.wasm":37700666},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>

</html>
